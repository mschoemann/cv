name: Render Quarto PDF

on:
  # push:
  schedule:
    # Every Saturday at 22:00 UTC → Sunday 00:00 CEST (UTC+2)
    - cron: '0 22 * * 6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ICU (stringr/stringi) + font/text-shaping libs (kableExtra, graphics).
      # libcurl dropped: no live networking at render time (Scholar reads CSVs).
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libicu-dev libfontconfig1-dev libharfbuzz-dev libfribidi-dev

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # Only bootstrap pacman; helper scripts call pacman::p_load() themselves.
      - name: Bootstrap pacman
        shell: Rscript {0}
        run: if (!require("pacman")) install.packages("pacman", repos = "https://cloud.r-project.org")

      - name: Set up TinyTeX
        uses: r-lib/actions/setup-tinytex@v2

      - name: Install essential LaTeX packages
        run: tlmgr install marvosym parskip fancyhdr lastpage hyperref xcolor svg

      - name: Render PDF
        run: quarto render

      - name: Confirm PDF was created
        run: test -f docs/cv_mschoemann.pdf

      - name: Commit and Push PDF
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/cv_mschoemann.pdf
          git diff --staged --quiet || git commit -m "Update rendered PDF [skip ci]"
          git push
