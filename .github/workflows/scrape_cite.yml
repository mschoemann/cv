name: Update Scholar Stats

on:
  schedule:
    - cron: '0 5 * * 1'   # Mondays 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - name: Install packages
        run: Rscript -e 'install.packages("pacman"); pacman::p_load(dplyr, readr, scholar, stringr, lubridate, scales, googlesheets4, httr, xml2, rvest, pander, kableExtra)'

      - name: Scrape Scholar
        run: Rscript code/scrape_cite.R

      - name: Commit updated CSVs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.csv
          git diff --staged --quiet || git commit -m "Update Scholar stats [skip ci]"
          git push
